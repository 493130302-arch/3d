<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>李清照 AR 数字人物</title><style>body{font-family:system-ui,sans-serif;background:#f4efe6;color:#2b2925;margin:0;padding:24px;line-height:1.6}main{max-width:560px;margin:auto;background:#fffaf2;padding:24px;border-radius:18px;box-shadow:0 8px 30px #5a4b321c}h1{margin-top:0;color:#536b73}.btn{display:block;text-align:center;background:#6f8990;color:white;padding:13px;margin:12px 0;border-radius:10px;border:0;width:100%;font-size:16px;text-decoration:none}.secondary{background:#b18c5a}.note{font-size:13px;color:#756f65}.poem{background:#eef3f1;padding:14px;border-radius:10px;white-space:pre-line}.status{min-height:1.4em;color:#657b81}</style></head><body><main><h1>李清照 · 现实融合展示</h1><p>将艺术化数字人物放入真实空间，并体验互动讲解。</p><a class="btn" rel="ar" href="assets/li-qingzhao-animated.usdz">在真实环境中查看李清照</a><button class="btn secondary" id="speak">🔊 语音讲解</button><button class="btn secondary" id="action">✨ 触发动作</button><div class="poem" id="poem">点击“播放诗词”，聆听《声声慢》节选。</div><button class="btn" id="play">▶ 播放诗词</button><p class="status" id="status"></p><p class="note">AR 需要 iPhone Safari、HTTPS 和支持 AR Quick Look 的设备。人物外观为参考图驱动的艺术化设计，不是历史肖像复原。</p><a href="index.html">返回普通 3D 展示</a></main><script>const status=document.querySelector('#status'),poem=`寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n——李清照《声声慢》节选`;document.querySelector('#speak').onclick=()=>{if(!('speechSynthesis'in window)){status.textContent='当前浏览器不支持语音合成';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('这是一位依据角色设计参考图制作的李清照艺术化数字人物。她身穿月白色宋制长裙，佩戴青黛披帛和发簪，手持折扇。');u.lang='zh-CN';speechSynthesis.speak(u);status.textContent='正在播放语音讲解'};document.querySelector('#play').onclick=()=>{document.querySelector('#poem').textContent=poem;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(poem);u.lang='zh-CN';speechSynthesis.speak(u);status.textContent='正在播放《声声慢》节选'}};document.querySelector('#action').onclick=()=>{status.textContent='动作提示：请在 AR 视图中移动、缩放或旋转人物；当前 USDZ 为静态展示模型。'};</script></body></html>
