<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>李清照互动 AR</title><script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script><style>body{font-family:system-ui,sans-serif;background:#f4efe6;color:#2b2925;margin:0;padding:16px}main{max-width:720px;margin:auto;background:#fffaf2;padding:18px;border-radius:18px}model-viewer{width:100%;height:62vh;min-height:420px;background:linear-gradient(#d9e5e4,#f4efe6);border-radius:14px;--poster-color:transparent}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.ar{background:#6f8990;color:#fff;border:0;border-radius:9px;padding:11px 14px;text-decoration:none;font-size:15px}.ar{background:#b18c5a}.status{color:#657b81;min-height:1.5em}.poem{white-space:pre-line;background:#eef3f1;padding:12px;border-radius:9px}</style></head><body><main><h1>李清照 · 互动 3D / AR</h1><model-viewer id="model" src="assets/li-qingzhao.glb" ios-src="assets/li-qingzhao-animated.usdz" camera-controls auto-rotate shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" alt="李清照艺术化三维模型"></model-viewer><div class="bar"><a class="ar" rel="ar" href="assets/li-qingzhao-animated.usdz">进入真实 AR</a><button id="speak">语音讲解</button><button id="poemBtn">播放诗词</button><button id="action">触发互动动作</button></div><p id="status" class="status">点击模型本体可触发互动；拖动旋转，双指缩放。</p><div id="poem" class="poem">《声声慢》节选将在这里显示。</div><p><a href="index.html">返回普通展馆</a></p></main><script>const m=document.querySelector('#model'),s=document.querySelector('#status'),p=document.querySelector('#poem');const poem=`寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n——李清照《声声慢》节选`;function say(t){if(!('speechSynthesis'in window)){s.textContent='当前浏览器不支持语音';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';speechSynthesis.speak(u);s.textContent='正在播放语音'}m.addEventListener('click',()=>{s.textContent='你点击了李清照模型：人物轻微转身并展示诗词';m.cameraOrbit='25deg 75deg 2.6m';say('寻寻觅觅，冷冷清清，凄凄惨惨戚戚。')});document.querySelector('#speak').onclick=()=>say('这是一位依据角色设计参考图制作的李清照艺术化数字人物。她身穿月白色宋制长裙，手持折扇。');document.querySelector('#poemBtn').onclick=()=>{p.textContent=poem;say(poem)};document.querySelector('#action').onclick=()=>{m.autoRotate=!m.autoRotate;s.textContent=m.autoRotate?'互动动作：人物开始循环展示':'互动动作：人物展示已暂停'};</script></body></html>
